name: Publish

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
  workflow_dispatch:
    inputs:
      path:
        description: 'Package path to publish (e.g. packages/core). Leave empty to publish everything.'
        required: false

permissions:
  contents: read

jobs:
  compute-matrix:
    name: Compute released packages
    runs-on: ubuntu-slim
    if: ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      has-releases: ${{ steps.compute.outputs.has-releases }}

    permissions:
      actions: read

    steps:
      - name: Download release outputs 📥
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: release-outputs
          path: release-outputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute matrix 🔎
        id: compute
        run: |
          releases_created=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.path }}" ]; then
              paths='["${{ inputs.path }}"]'
            else
              paths='["packages/core", "packages/yargs", "packages/commander"]'
            fi
          else
            if [ ! -f release-outputs/paths_released ]; then
              echo "::error::release-outputs/paths_released not found in the downloaded artifact"
              exit 1
            fi
            paths="$(cat release-outputs/paths_released)"
            paths="${paths:-[]}"
            releases_created="$(cat release-outputs/releases_created 2>/dev/null || echo false)"
          fi
          echo "matrix={\"path\":$paths}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$paths" | node -e "process.stdin.once('data', d => console.log(JSON.parse(d).length))")" = "0" ]; then
            if [ "$releases_created" = "true" ]; then
              echo "::error::Release Please created a release but reported no released paths"
              exit 1
            fi
            echo "has-releases=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-releases=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish ${{ matrix.path }}
    needs: compute-matrix
    if: ${{ needs.compute-matrix.outputs.has-releases == 'true' }}
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup pnpm 🏗
        uses: pnpm/action-setup@v6

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript 🔨
        run: pnpm --filter "{./${{ matrix.path }}}..." run build

      - name: Publish to npm 📦
        run: pnpm publish --filter "./${{ matrix.path }}" --provenance --no-git-checks

      - name: Setup node env for GitHub Packages 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com

      - name: Publish to GitHub Packages 📦
        run: pnpm publish --filter "./${{ matrix.path }}" --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-publish:
    name: Verify releases were published
    needs: [compute-matrix, publish]
    if: ${{ always() && needs.compute-matrix.outputs.has-releases == 'true' && needs.publish.result != 'success' }}
    runs-on: ubuntu-slim

    steps:
      - name: Fail when releases were not published ❌
        run: |
          echo "::error::Releases were created but the publish job result was '${{ needs.publish.result }}'"
          exit 1
