name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup pnpm 🏗
        uses: pnpm/action-setup@v6

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test -- --coverage

      - name: Benchmark (smoke)
        run: pnpm --filter @getargvio/argvio run bench -- --run

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '24'
        uses: codecov/codecov-action@v7
        with:
          slug: ${{ github.repository }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  peer-versions:
    name: peer version matrix (${{ matrix.package }} @ ${{ matrix.peer }}@${{ matrix.version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: yargs
            peer: yargs
            version: latest
          - package: yargs
            peer: yargs
            version: previous-minor
          - package: commander
            peer: commander
            version: latest
          - package: commander
            peer: commander
            version: previous-minor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@v7

      - name: Setup pnpm 🏗
        uses: pnpm/action-setup@v6

      - name: Setup node env 🏗
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @getargvio/argvio run build

      - name: Pin previous minor peer dependency
        if: matrix.version == 'previous-minor'
        working-directory: packages/${{ matrix.package }}
        run: |
          current="$(npm view ${{ matrix.peer }} version)"
          previous_minor="$(npm view ${{ matrix.peer }} versions --json | node -e "
            const versions = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const [currentMajor, currentMinor] = '${current}'.split('.').map(Number);
            const match = versions.reverse().find((v) => {
              const [major, minor] = v.split('.').map(Number);
              return major === currentMajor && minor < currentMinor;
            });
            console.log(match ?? '${current}');
          ")"
          pnpm add "${{ matrix.peer }}@${previous_minor}"

      - name: Test
        run: pnpm --filter @getargvio/${{ matrix.package }} run test
