name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    outputs:
      releases: ${{ steps.release.outputs.paths_released }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Save release outputs 💾
        run: |
          mkdir -p release-outputs
          echo '${{ steps.release.outputs.paths_released }}' > release-outputs/paths_released
          echo '${{ steps.release.outputs.releases_created }}' > release-outputs/releases_created

      - name: Upload release outputs 📤
        uses: actions/upload-artifact@v7
        with:
          name: release-outputs
          path: release-outputs
